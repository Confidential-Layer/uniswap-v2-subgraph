name: Build and Push Image

on:
  push:
    branches:
      - "**" # change to main

env:
  IMAGE_NAME: ghcr.io/confidential-layer/uniswap-v2-subgraph:${{ github.sha }}
  CACHE_REPO: ghcr.io/confidential-layer/uniswap-v2-subgraph/cache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get -y install buildah

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.repository_owner }} --password-stdin               

      - name: Build Image
        run: |
          buildah bud \
          --file docker/Dockerfile \
          --layers \
          --cache-from $CACHE_REPO \
          --cache-to $CACHE_REPO \
          -t $IMAGE_NAME .

      - name: Push Image (tag)
        run: |
          buildah push $IMAGE_NAME